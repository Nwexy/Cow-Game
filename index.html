<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="description" content="Click the cow, earn points, and level up! Simple retro pixel-art clicker game." />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:;" />
  <title>Cow Clicker</title>
  <link rel="stylesheet" href="node_modules/@fontsource/press-start-2p/index.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="game">
    <!-- Top HUD -->
    <header id="hud">
      <img id="hud-icon" src="assets/cow.png" alt="" />
      <h1 id="score">0</h1>
      <p id="cps">0 COWS PER SECOND</p>
      <p id="per-click">PER CLICK: 1</p>
    </header>

    <!-- Level meter (left) -->
    <aside id="level-meter" aria-label="Level progress">
      <span id="level-label">LV1</span>
      <div id="level-bar"><div id="level-fill"></div></div>
      <span id="level-mult">x1</span>
    </aside>

    <!-- Cow Area -->
    <section id="cow-area">
      <button id="cow-btn" aria-label="Click the cow">
        <img id="cow" src="assets/cow.png" alt="Cow" draggable="false" />
        <div id="cow-glasses" class="glasses-wrapper" aria-hidden="true">
          <svg class="glasses-svg" viewBox="0 0 46 16" shape-rendering="crispEdges">
            <rect x="0" y="2" width="6" height="3" fill="#121216" />
            <rect x="40" y="2" width="6" height="3" fill="#121216" />
            <rect x="4" y="2" width="38" height="3" fill="#121216" />
            <rect x="4" y="5" width="17" height="8" fill="#121216" />
            <rect x="6" y="13" width="13" height="3" fill="#121216" />
            <rect x="25" y="5" width="17" height="8" fill="#121216" />
            <rect x="27" y="13" width="13" height="3" fill="#121216" />
            <rect x="6" y="5" width="13" height="7" fill="#1a1d24" />
            <rect x="8" y="12" width="9" height="2" fill="#1a1d24" />
            <rect x="27" y="5" width="13" height="7" fill="#1a1d24" />
            <rect x="29" y="12" width="9" height="2" fill="#1a1d24" />
            <rect x="8" y="5" width="3" height="3" fill="#ffffff" />
            <rect x="11" y="8" width="3" height="3" fill="rgba(255,255,255,0.7)" />
            <rect x="29" y="5" width="3" height="3" fill="#ffffff" />
            <rect x="32" y="8" width="3" height="3" fill="rgba(255,255,255,0.7)" />
          </svg>
          <div class="glasses-glint"></div>
        </div>
      </button>
      <div id="cow-shadow"></div>
    </section>

    <!-- Shop -->
    <section id="shop" aria-label="Shop">
      <div id="shop-list"></div>
    </section>

    <!-- Level up notification -->
    <div id="levelup-banner" class="hidden">
      <div class="lu-title" id="levelup-title">LEVEL UP!</div>
      <div class="lu-rank" id="levelup-rank">★ CALF ★</div>
      <div class="lu-sub" id="levelup-sub">LV2</div>
    </div>

    <audio id="bg-music" src="assets/cow_music.mp3" loop preload="auto"></audio>
    <button id="music-btn" title="Music On/Off">♪</button>
    <button id="reset-btn" title="Reset Game">↺</button>
  </main>

  <script src="game.js"></script>
  <script src="music.js"></script>
</body>
</html>
